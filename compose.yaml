name: foodies
include:
  - compose.api.yaml
services:
  web:
    image: foodies-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_ORIGIN: ${FOODIES_API_ORIGIN:-http://api:8080}
    ports:
      - "127.0.0.1:${FOODIES_WEB_PORT:-3003}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 20s
